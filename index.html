<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实盘基金跟踪 · Fund Tracker</title>
<link rel="stylesheet" href="https://tim0thy1.github.io/design-system/design-system.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-sans);
    font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    transition:background .3s ease,color .3s ease;
  }
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 60px}

  /* 头部 */
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
  .head-left .kicker{font-size:11px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-weight:800;margin-bottom:6px}
  .head-left h1{font-size:26px;font-weight:800;line-height:1.2}
  .head-left .sub{font-size:13px;color:var(--muted);margin-top:6px}
  .head-right{text-align:right;font-size:12px;color:var(--muted)}
  .head-right .sync-time{font-family:var(--font-mono);font-size:11px}

  /* 汇总卡 */
  .summary{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;
  }
  .sum-card{
    background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);transition:background .3s,border-color .3s;
  }
  .sum-card .l{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .sum-card .v{font-family:var(--font-mono);font-weight:800;font-size:22px;line-height:1.2}
  .sum-card .s{font-size:11px;color:var(--muted);margin-top:3px}
  .sum-card .v.up{color:var(--red)}
  .sum-card .v.down{color:var(--green)}

  /* 基金卡片 */
  .fund-card{
    background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius-lg);
    padding:22px;margin-bottom:16px;box-shadow:var(--shadow);transition:background .3s,border-color .3s;
  }
  .fund-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .fund-name{font-size:17px;font-weight:800}
  .fund-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
  .fund-meta .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:1px 10px;border-radius:20px;font-weight:700;font-size:11px}
  .fund-nav{text-align:right}
  .fund-nav .nav-val{font-family:var(--font-mono);font-weight:800;font-size:20px}
  .fund-nav .nav-date{font-size:11px;color:var(--muted);margin-top:2px}
  .fund-nav .nav-label{font-size:11px;color:var(--muted)}

  .fund-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;border-top:1px solid var(--rule);padding-top:16px}
  .f-cell .l{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}
  .f-cell .v{font-family:var(--font-mono);font-weight:700;font-size:15px}
  .f-cell .v.up{color:var(--red)}
  .f-cell .v.down{color:var(--green)}

  /* 净值走势 */
  .chart-box{margin-top:20px;border-top:1px solid var(--rule);padding-top:16px}
  .chart-box .chart-title{font-size:13px;font-weight:700;margin-bottom:10px}
  .chart-box svg{width:100%;height:auto;display:block}

  /* 加密货币区块 */
  .crypto-block{margin-top:30px;padding-top:26px;border-top:1px solid var(--rule)}
  .crypto-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin-bottom:4px}
  .crypto-title .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(0,200,120,.5);animation:pulse 1.8s infinite}
  .crypto-title .live-dot.err{background:var(--red);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,200,120,.5)}70%{box-shadow:0 0 0 7px rgba(0,200,120,0)}100%{box-shadow:0 0 0 0 rgba(0,200,120,0)}}
  .crypto-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .tag.short{background:var(--red-dim);color:var(--red)}
  .tag.long{background:var(--green-dim);color:var(--green)}
  .price-status{font-size:11px;color:var(--muted);margin-top:2px}
  .price-status.err{color:var(--red)}
  .liq{font-size:11px;color:var(--muted);margin-top:2px}
  .liq b{font-family:var(--font-mono);font-weight:700}

  /* 说明 */
  .note{
    background:var(--bg3);border:1px solid var(--rule);border-radius:var(--radius);
    padding:14px 16px;font-size:12px;color:var(--muted);line-height:1.7;margin-top:24px;
  }
  .note b{color:var(--ink)}

  @media (max-width:768px){
    .summary{grid-template-columns:repeat(2,1fr)}
    .fund-grid{grid-template-columns:repeat(2,1fr)}
    .head-right{text-align:left}
    .wrap{padding:22px 14px 50px}
  }
</style>
<script>
/* 主题跟随：读取工作台 localStorage 的 wb_theme_v1，同 origin 共享 */
(function(){
  try{
    var t = localStorage.getItem('wb_theme_v1') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    window.addEventListener('storage', function(e){
      if(e.key === 'wb_theme_v1') document.documentElement.setAttribute('data-theme', e.newValue || 'light');
    });
  }catch(e){}
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="head-left">
      <div class="kicker">REAL MONEY · FUNDS</div>
      <h1>实盘账户跟踪</h1>
      <div class="sub">QDII 基金 + A股 + 现金 · 账户总览</div>
    </div>
    <div class="head-right">
      <div>数据源：天天基金</div>
      <div class="sync-time" id="sync-time">—</div>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div id="fund-list"></div>
  <div id="cash-row" style="margin-bottom:16px"></div>

  <div class="note">
    <b>说明：</b>两只 QDII 基金（投资港股/海外）净值 T+1/T+2 更新，<b>无盘中实时估值</b>，由 GitHub Actions 每天自动从天天基金同步。A股康龙化成为持仓股票，现价实时获取。账户总资产 = 基金市值 + 股票市值 + 现金。持仓浮动盈亏仅按基金和股票的「现价 × 数量 − 总成本」计算，不含手续费，<b>现金不参与盈亏计算</b>。
  </div>
</div>

<script>
(function(){
  var data = null;

  function fmt(n, d){
    return n.toLocaleString('zh-CN', {minimumFractionDigits:d||2, maximumFractionDigits:d||2});
  }
  function pct(n){
    var s = n >= 0 ? '+' : '';
    return s + n.toFixed(2) + '%';
  }
  function cls(n){ return n >= 0 ? 'up' : 'down'; }

  function load(){
    fetch('data/funds.json?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        data = d;
        renderFunds();
        renderCash();
        renderStocks(data.stocks || []);
      })
      .catch(function(e){
        document.getElementById('fund-list').innerHTML =
          '<div style="text-align:center;color:var(--muted);padding:40px 0">数据加载失败：' + e.message + '</div>';
      });
  }

  /* A股实时价格：新浪 + 腾讯 fallback。st 支持 kv(now,prev_close,open,high,low,volume,amount) */
  function fetchStockPrice(code, symbol){
    var sources = [
      {
        url: 'https://hq.sinajs.cn/list=' + code,
        headers: { 'Referer': 'https://finance.sina.com.cn' },
        parse: function(t){
          var m = t.match(/="([^"]*)"/);
          if(!m) return null;
          var p = m[1].split(',');
          // 康龙类 A股：字段[3]=当前价,[4]=昨收
          var now = parseFloat(p[3]), prev = parseFloat(p[4]);
          if(isNaN(now)||!now) return null;
          return { now: now, prev: prev, name: p[0] };
        }
      },
      {
        url: 'https://qt.gtimg.cn/q=' + code,
        parse: function(t){
          var m = t.match(/="([^"]*)"/);
          if(!m) return null;
          var p = m[1].split('~');
          var now = parseFloat(p[3]), prev = parseFloat(p[4]);
          if(isNaN(now)||!now) return null;
          return { now: now, prev: prev, name: p[1] };
        }
      }
    ];
    var i = 0;
    function next(){
      if(i >= sources.length) return Promise.reject(new Error('所有价格源均不可用'));
      var s = sources[i++];
      return fetch(s.url)
        .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(s.parse)
        .then(function(v){ if(!v) throw new Error('解析失败'); return v; })
        .catch(function(){ return next(); });
    }
    return next();
  }

  /* 股票卡片 */
  function renderStocks(stocks){
    var host = document.getElementById('fund-list');
    var done = 0, total = stocks.length;
    function finish(){ if(++done >= total){ renderSummary(); } }
    stocks.forEach(function(s){
      var card = document.createElement('div');
      card.className = 'fund-card';
      card.innerHTML =
        '<div class="fund-head">' +
          '<div>' +
            '<div class="fund-name">' + s.short_name + '</div>' +
            '<div class="fund-meta">' +
              '<span class="tag">' + (s.type||'股票') + '</span>' +
              '<span>' + s.symbol + '</span>' +
              '<span>' + (s.exchange||'') + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="fund-nav"><div class="nav-label">现价（实时）</div><div class="nav-val" id="sv-' + s.symbol + '">…</div><div class="nav-date" id="svd-' + s.symbol + '">加载中</div></div>' +
        '</div>' +
        '<div class="fund-grid">' +
          '<div class="f-cell"><div class="l">持仓数量</div><div class="v">' + fmt(s.shares, 0) + ' 股</div></div>' +
          '<div class="f-cell"><div class="l">成本价</div><div class="v">' + fmt(s.cost, 3) + '</div></div>' +
          '<div class="f-cell"><div class="l">总成本</div><div class="v">¥' + fmt(s.shares * s.cost) + '</div></div>' +
          '<div class="f-cell"><div class="l">当前市值</div><div class="v 2" data-stock-mkt="' + s.symbol + '">计算中</div></div>' +
          '<div class="f-cell"><div class="l">累计盈亏</div><div class="v" data-stock-pnl="' + s.symbol + '">—</div></div>' +
          '<div class="f-cell"><div class="l">收益率</div><div class="v" data-stock-pct="' + s.symbol + '">—</div></div>' +
        '</div>';
      host.appendChild(card);

      fetchStockPrice(s.code, s.symbol).then(function(px){
        var mkt = px.now * s.shares;
        var cost = s.shares * s.cost;
        var pnl = mkt - cost;
        var p = cost > 0 ? pnl / cost * 100 : 0;
        var pr = px.prev ? (px.now - px.prev) / px.prev * 100 : 0;
        document.getElementById('sv-' + s.symbol).textContent = '¥' + fmt(px.now, 3);
        document.getElementById('svd-' + s.symbol).textContent = (px.name || s.symbol) + ' · 实时';
        var mktEl = document.querySelector('[data-stock-mkt="' + s.symbol + '"]');
        var pnlEl = document.querySelector('[data-stock-pnl="' + s.symbol + '"]');
        var pctEl = document.querySelector('[data-stock-pct="' + s.symbol + '"]');
        mktEl.textContent = '¥' + fmt(mkt);
        mktEl.className = 'v';
        pnlEl.textContent = (pnl>=0?'+':'') + fmt(pnl);
        pnlEl.className = 'v ' + cls(pnl);
        pctEl.textContent = pct(p);
        pctEl.className = 'v ' + cls(p);
        var navVal = document.getElementById('sv-' + s.symbol);
        navVal.classList.add(pr > 0 ? 'up' : (pr < 0 ? 'down' : ''));
        s._mkt = mkt; s._cost = cost; s._pnl = pnl;
        finish();
      }).catch(function(e){
        document.getElementById('sv-' + s.symbol).textContent = '—';
        document.getElementById('svd-' + s.symbol).textContent = '获取失败';
        var mktEl = document.querySelector('[data-stock-mkt="' + s.symbol + '"]');
        mktEl.textContent = '—';
        s._mkt = null; s._cost = s.shares * s.cost; s._pnl = null;
        finish();
      });
    });
  }

  /* 汇总卡：总资产 = 基金市值 + 股票市值 + 现金；盈亏只算持仓本身，现金不参与盈亏 */
  var SUMMARY = { fundCost:0, fundMkt:0 };
  function renderSummary(){
    var cash = data.cash || 0;
    var stockMkt = 0, stockCost = 0, stockOk = true;
    (data.stocks || []).forEach(function(s){
      stockCost += s.shares * s.cost;
      if(s._mkt == null){ stockOk = false; } else { stockMkt += s._mkt; }
    });
    var totalAsset = SUMMARY.fundMkt + stockMkt + cash;
    var totalCost = SUMMARY.fundCost + stockCost;          // 成本=基金+股票（不含现金）
    var holdPnl = (SUMMARY.fundMkt - SUMMARY.fundCost) + (stockMkt - stockCost); // 仅持仓浮盈
    var holdCost = totalCost;                              // 收益率分母=持仓成本
    var holdPct = holdCost > 0 ? holdPnl / holdCost * 100 : 0;
    var sum = document.getElementById('summary');
    sum.innerHTML =
      '<div class="sum-card"><div class="l">账户总资产</div><div class="v">¥' + fmt(totalAsset) + '</div><div class="s">基金 + 股票 + 现金</div></div>' +
      '<div class="sum-card"><div class="l">持仓成本</div><div class="v">¥' + fmt(totalCost) + '</div><div class="s">基金 + 股票</div></div>' +
      '<div class="sum-card"><div class="l">持仓浮动盈亏</div><div class="v ' + cls(holdPnl) + '">' + (holdPnl>=0?'+':'') + fmt(holdPnl) + '</div><div class="s">仅基金+股票，现金不计</div></div>' +
      '<div class="sum-card"><div class="l">现金</div><div class="v">¥' + fmt(cash) + '</div><div class="s">账户余额</div></div>';
  }

  /* 现金行 */
  function renderCash(){
    var host = document.getElementById('cash-row');
    var cash = data.cash || 0;
    if(data.cash === undefined) return;
    host.innerHTML =
      '<div class="fund-card" style="margin-bottom:0">' +
        '<div class="fund-head">' +
          '<div><div class="fund-name">💰 现金</div><div class="fund-meta"><span class="tag">现金余额</span><span>账户可用</span></div></div>' +
          '<div class="fund-nav"><div class="nav-label">现金</div><div class="nav-val">¥' + fmt(cash) + '</div></div>' +
        '</div>' +
      '</div>';
  }

  /* 基金渲染（存基金汇总） */
  function renderFunds(){
    var funds = data.funds;
    SUMMARY.fundCost = 0; SUMMARY.fundMkt = 0;
    funds.forEach(function(f){
      SUMMARY.fundCost += f.shares * f.cost;
      SUMMARY.fundMkt += f.shares * f.nav;
    });

    document.getElementById('sync-time').textContent = '同步时间：' + (data.synced_at || '—');

    var list = document.getElementById('fund-list');
    var sectionTitle = document.createElement('div');
    sectionTitle.style.cssText = 'font-size:14px;font-weight:800;color:var(--ink);margin:26px 0 12px';
    sectionTitle.textContent = '📊 基金持仓';
    list.appendChild(sectionTitle);

    funds.forEach(function(f){
      var cost = f.shares * f.cost;
      var mkt = f.shares * f.nav;
      var pnl = mkt - cost;
      var p = cost > 0 ? pnl / cost * 100 : 0;
      var card = document.createElement('div');
      card.className = 'fund-card';
      card.innerHTML =
        '<div class="fund-head">' +
          '<div>' +
            '<div class="fund-name">' + f.short_name + '</div>' +
            '<div class="fund-meta">' +
              '<span class="tag">' + (f.type||'基金') + '</span>' +
              '<span>' + f.code + '</span>' +
              '<span>' + (f.company||'') + '</span>' +
              '<span>' + (f.manager||'') + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="fund-nav">' +
            '<div class="nav-label">最新净值</div>' +
            '<div class="nav-val">' + f.nav.toFixed(4) + '</div>' +
            '<div class="nav-date">' + f.nav_date + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="fund-grid">' +
          '<div class="f-cell"><div class="l">持仓份额</div><div class="v">' + fmt(f.shares, 2) + '</div></div>' +
          '<div class="f-cell"><div class="l">成本价</div><div class="v">' + f.cost.toFixed(4) + '</div></div>' +
          '<div class="f-cell"><div class="l">总成本</div><div class="v">¥' + fmt(cost) + '</div></div>' +
          '<div class="f-cell"><div class="l">当前市值</div><div class="v">¥' + fmt(mkt) + '</div></div>' +
          '<div class="f-cell"><div class="l">累计盈亏</div><div class="v ' + cls(pnl) + '">' + (pnl>=0?'+':'') + fmt(pnl) + '</div></div>' +
          '<div class="f-cell"><div class="l">收益率</div><div class="v ' + cls(p) + '">' + pct(p) + '</div></div>' +
        '</div>';
      list.appendChild(card);
    });

    renderSummary();
  }

  load();
})();
</script>
</body>
</html>
